<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายละเอียดสินค้า | Second-hand Computer Marketplace System</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .detail-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 2rem;
      margin-top: 1.5rem;
    }
    @media (max-width: 900px) {
      .detail-grid {
        grid-template-columns: 1fr;
      }
    }
    .loading-block {
      text-align: center;
      padding: 5rem 0;
    }
    .loading-text {
      margin-top: 1rem;
      color: var(--text-muted);
    }
    .empty-state-icon .icon {
      width: 3rem;
      height: 3rem;
    }
    .back-link-row {
      margin-bottom: 1.5rem;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .product-img-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 380px;
      position: relative;
    }
    .product-img-box img {
      max-width: 100%;
      max-height: 420px;
      object-fit: contain;
      border-radius: var(--radius);
    }
    .product-img-placeholder {
      color: var(--text-muted);
    }
    .product-img-placeholder .icon {
      width: 64px;
      height: 64px;
    }
    .verified-chip {
      position: absolute;
      top: 1rem;
      right: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--success);
      color: #fff;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .verified-chip .icon {
      width: 14px;
      height: 14px;
    }
    .wishlist-toggle-btn {
      position: absolute;
      top: 1rem;
      left: 1rem;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: var(--transition);
      padding: 0;
    }
    .wishlist-toggle-btn:hover {
      border-color: var(--highlight);
      color: var(--highlight);
    }
    .wishlist-toggle-btn.active {
      color: var(--highlight);
      border-color: var(--highlight);
    }
    .wishlist-toggle-btn.active .icon {
      fill: currentColor;
    }
    .wishlist-toggle-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .wishlist-toggle-btn .icon {
      width: 18px;
      height: 18px;
    }
    .proof-gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 1rem;
    }
    .proof-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.8rem;
      text-align: center;
    }
    .proof-box img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .proof-box-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .proof-title-success { color: var(--success); }
    .proof-title-highlight { color: var(--highlight); }
    .proof-empty {
      height: 140px;
      background: var(--bg-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-radius: 6px;
    }
    .security-note {
      background: rgba(18, 184, 134, 0.05);
      border: 1px solid rgba(18, 184, 134, 0.25);
      border-radius: var(--radius);
      padding: 1.2rem;
      margin-top: 1rem;
    }
    .dark-mode .security-note {
      background: rgba(46, 204, 113, 0.05);
      border-color: rgba(46, 204, 113, 0.25);
    }
    .security-note-title {
      margin: 0 0 0.5rem 0;
      color: var(--success);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .security-note-text {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin: 0;
      line-height: 1.5;
    }
    .product-info-col {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .product-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--highlight);
      color: white;
      padding: 3px 8px;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 4px;
    }
    .product-title {
      font-size: 1.8rem;
      margin-top: 0.5rem;
      line-height: 1.2;
      color: var(--text-primary);
    }
    .product-price {
      font-size: 2.2rem;
      color: var(--success);
      margin: 0.5rem 0;
    }
    .info-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.2rem;
    }
    .section-card-title {
      margin: 0 0 0.5rem 0;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-title-sm {
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .specs-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }
    .specs-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }
    .specs-table td:first-child {
      color: var(--text-muted);
      width: 35%;
      font-weight: 600;
    }
    .specs-table td:last-child {
      color: var(--text-primary);
    }
    .mono-highlight {
      font-family: monospace;
      color: var(--accent-light);
    }
    .description-text {
      color: var(--text-secondary);
      font-size: 0.9rem;
      line-height: 1.6;
      white-space: pre-wrap;
      margin: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
    }
    .seller-profile-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem;
      margin-top: 1rem;
    }
    .seller-card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }
    .seller-name {
      margin: 0;
      color: var(--text-primary);
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .seller-trust-line {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
      font-size: 0.82rem;
      margin-top: 4px;
    }
    .kyc-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(18, 184, 134, 0.15);
      color: var(--success);
      border: 1px solid rgba(18, 184, 134, 0.3);
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: var(--radius);
      white-space: nowrap;
    }
    .dark-mode .kyc-badge {
      background: rgba(46, 204, 113, 0.15);
      border-color: rgba(46, 204, 113, 0.3);
    }
    .detail-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 0.5rem;
    }
    .btn-block {
      width: 100%;
    }
    .bottom-nav-icon {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bottom-nav-icon .icon {
      width: 20px;
      height: 20px;
    }
  </style>
</head>

  <script src="/js/app.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');
    let activeProduct = null;

    // === UI Helpers: button loading state (see login.html / UI_UX_Guidelines.md) ===
    function setBtnLoading(btn, loading) {
      if (!btn) return;
      if (loading) {
        btn.dataset.originalText = btn.dataset.originalText || btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>';
      } else {
        btn.disabled = false;
        if (btn.dataset.originalText) btn.innerHTML = btn.dataset.originalText;
      }
    }

    const ICON_ALERT_TRIANGLE = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>';
    const ICON_HEART = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.5 4.04 3 5.5l7 7Z"></path></svg>';

    async function loadSellerReviews(sellerId) {
      const container = document.getElementById('seller-reviews-list');
      if (!container) return;
      try {
        const data = await API.get(`/products/seller/${sellerId}/reviews`);
        const reviews = data.reviews || [];
        if (!reviews.length) {
          container.innerHTML = '';
          return;
        }
        container.innerHTML = `
          <div style="margin-top:0.75rem; border-top:1px solid var(--border); padding-top:0.75rem;">
            ${reviews.map(r => `
              <div style="margin-bottom:0.6rem; font-size:0.85rem;">
                <div style="display:flex; align-items:center; gap:6px; color:var(--text-secondary);">
                  <strong style="color:var(--text-primary);">${escapeHtml(r.reviewer_name)}</strong>
                  <span class="text-warning">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
                  <span style="color:var(--text-muted); font-size:0.75rem;">${formatDate(r.created_at)}</span>
                </div>
                ${r.comment ? `<p style="margin:2px 0 0; color:var(--text-secondary);">${escapeHtml(r.comment)}</p>` : ''}
              </div>
            `).join('')}
          </div>
        `;
      } catch (err) {
        container.innerHTML = '';
      }
    }

    async function loadProductDetail() {
      const container = document.getElementById('detail-container');
      if (!productId) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">${ICON_ALERT_TRIANGLE}</div>
            <h3>ไม่พบรหัสสินค้านี้</h3>
            <a href="/products.html" class="btn btn-primary mt-2">กลับไปหน้า Marketplace</a>
          </div>
        `;
        return;
      }

      try {
        const product = await API.get(`/products/${productId}`);
        activeProduct = product;
        document.title = `${product.brand || 'คอมเซ็ต'} ${product.model || product.part_name || ''} | Second-hand Computer Marketplace System`;

        let prebuiltSpecs = null;
        if (product.is_prebuilt_set && product.prebuilt_specs) {
          try {
            prebuiltSpecs = typeof product.prebuilt_specs === 'string' ? JSON.parse(product.prebuilt_specs) : product.prebuilt_specs;
          } catch (e) {
            console.error('Failed to parse prebuilt specs:', e);
          }
        }

        const image = product.photos?.[0];

        container.innerHTML = `
          <div class="back-link-row">
            <a href="/products.html" class="back-link text-muted">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m12 19-7-7 7-7"></path>
                <path d="M19 12H5"></path>
              </svg>
              กลับไปหน้า Marketplace
            </a>
          </div>

          <div class="detail-grid">
            <!-- ซ้าย: รูปภาพสินค้า & หลักฐานความปลอดภัย -->
            <div>
              <div class="product-img-box">
                <button class="wishlist-toggle-btn" id="wishlist-toggle-btn" type="button" aria-label="เพิ่มในรายการที่ถูกใจ" aria-pressed="false" title="เพิ่มในรายการที่ถูกใจ">
                  ${ICON_HEART}
                </button>
                ${product.proof_image_url ? `
                  <div class="verified-chip">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path>
                      <path d="m9 12 2 2 4-4"></path>
                    </svg>
                    มีรูปคู่ป้ายชื่อ Verified
                  </div>
                ` : ''}
                ${image ? `<img src="${escapeHtml(image)}" alt="${escapeHtml(product.part_name || 'Product Image')}">` : `
                  <div class="product-img-placeholder">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                      <line x1="8" y1="21" x2="16" y2="21"></line>
                      <line x1="12" y1="17" x2="12" y2="21"></line>
                    </svg>
                  </div>
                `}
              </div>

              <!-- Proof of Possession & SN Gallery -->
              <div class="proof-gallery">
                <div class="proof-box">
                  <div class="proof-box-title proof-title-success">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"></path>
                      <circle cx="12" cy="13" r="3"></circle>
                    </svg>
                    รูปคู่ป้ายชื่อร้าน / ผู้ขาย
                  </div>
                  ${product.proof_image_url ? `
                    <a href="${product.proof_image_url}" target="_blank">
                      <img src="${product.proof_image_url}" alt="Proof of Possession">
                    </a>
                  ` : `
                    <div class="proof-empty">ไม่มีรูปคู่ป้ายชื่อ</div>
                  `}
                </div>

                <div class="proof-box">
                  <div class="proof-box-title proof-title-highlight">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <line x1="4" y1="9" x2="20" y2="9"></line>
                      <line x1="4" y1="15" x2="20" y2="15"></line>
                      <line x1="10" y1="3" x2="8" y2="21"></line>
                      <line x1="16" y1="3" x2="14" y2="21"></line>
                    </svg>
                    รูปถ่าย Serial Number (SN)
                  </div>
                  ${product.sn_image_url ? `
                    <a href="${product.sn_image_url}" target="_blank">
                      <img src="${product.sn_image_url}" alt="Serial Number Photo">
                    </a>
                  ` : `
                    <div class="proof-empty">ไม่มีรูปสติกเกอร์ SN</div>
                  `}
                </div>
              </div>

              <!-- ข้อมูลความปลอดภัย P2P -->
              <div class="security-note">
                <h4 class="security-note-title">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path>
                    <path d="m9 12 2 2 4-4"></path>
                  </svg>
                  มาตรการความปลอดภัย & Slip Verification
                </h4>
                <p class="security-note-text">
                  ผู้ซื้อจะโอนเงินตรงเข้าบัญชีธนาคารของผู้ขายที่ผ่านการยืนยันตัวตน KYC เท่านั้น และระบบจะตรวจสลิปอัตโนมัติผ่าน SlipOK เพื่อป้องกันสลิปปลอมแปลง
                </p>
              </div>
            </div>

            <!-- ขวา: ข้อมูลสเปกและปุ่มสั่งซื้อ -->
            <div class="product-info-col">
              <div>
                <span class="product-badge">
                  ${escapeHtml(product.category_name || 'Hardware')}
                </span>
                <h1 class="product-title">
                  ${escapeHtml(product.brand || '')} ${escapeHtml(product.model || '')}
                </h1>
                <div class="detail-price-row">
                  ${Number(product.original_price) > Number(product.price) ? `<span class="original-price">${formatPrice(product.original_price)}</span>` : ''}
                  <h2 class="product-price">${formatPrice(product.price)}</h2>
                </div>
              </div>

              <!-- รายละเอียดสเปกย่อย -->
              <div class="info-card">
                <h4 class="section-card-title">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                    <path d="M12 11h4"></path>
                    <path d="M12 16h4"></path>
                    <path d="M8 11h.01"></path>
                    <path d="M8 16h.01"></path>
                  </svg>
                  ข้อมูลสเปกและสภาพสินค้า
                </h4>

                <table class="specs-table">
                  <tr><td>สภาพสินค้า:</td><td><strong class="text-warning">${product.condition === 'new' ? 'มือหนึ่ง (New)' : 'มือสอง ' + (product.condition === 'used_90' ? '90%+' : '80%+')}</strong></td></tr>
                  <tr><td>ประกันคงเหลือ:</td><td>${product.remaining_warranty_months || 0} เดือน</td></tr>
                  <tr><td>Serial Number:</td><td><strong class="mono-highlight">${escapeHtml(product.serial_number || '-')}</strong></td></tr>
                  <tr><td>รหัสสต็อก (SKU):</td><td><code>${escapeHtml(product.sku || '-')}</code></td></tr>
                  <tr><td>สต็อกคงเหลือ:</td><td>พร้อมขาย ${product.stock_quantity || 1} ชิ้น</td></tr>
                  ${product.specs && Object.keys(product.specs).length > 0 ? Object.entries(product.specs).map(([k, v]) => {
                    if (v === null || v === undefined || v === '') return '';
                    const labelMap = { socket: 'ซ็อกเก็ต (Socket)', chipset: 'ชิปเซ็ต (Chipset)', generation: 'เจนเนอเรชัน', cores: 'จำนวน Core', threads: 'จำนวน Thread', ram_type: 'ชนิด RAM', capacity_gb: 'ความจุ', speed: 'บัสความเร็ว', vram_gb: 'VRAM (GB)', vram_type: 'ชนิด VRAM', wattage: 'กำลังไฟ (Wattage)', form_factor: 'ขนาดบอร์ด/เคส' };
                    return `<tr><td>${labelMap[k] || k}:</td><td><strong>${escapeHtml(String(v))}</strong></td></tr>`;
                  }).join('') : ''}
                </table>
              </div>

              <!-- คำอธิบายเพิ่มเติม -->
              <div>
                <h4 class="section-title-sm">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path>
                    <path d="m15 5 4 4"></path>
                  </svg>
                  รายละเอียดเพิ่มเติมจากผู้ขาย
                </h4>
                <p class="description-text">
                  ${escapeHtml(product.description || 'ไม่มีคำอธิบายเพิ่มเติม')}
                </p>
              </div>

              <!-- ข้อมูลผู้ขาย (Verified Seller Badge) -->
              <div class="seller-profile-card">
                <div class="seller-card-row">
                  <div>
                    <h4 class="seller-name">
                      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5"></path>
                        <path d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244"></path>
                        <path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05"></path>
                      </svg>
                      ${escapeHtml(product.seller_name || 'ผู้ขาย')}
                    </h4>
                    <div class="seller-trust-line">
                      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path>
                        <path d="m9 12 2 2 4-4"></path>
                      </svg>
                      ยืนยันตัวตน KYC • บัญชีธนาคารตรงกับชื่อจริง
                    </div>
                    <div class="seller-trust-line">
                      ${Number(product.seller_rating) > 0
                        ? `<svg class="icon icon-sm text-warning" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg> ${Number(product.seller_rating).toFixed(1)} / 5.0`
                        : 'ยังไม่มีรีวิว'}
                    </div>
                  </div>
                  <span class="kyc-badge">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M20 6 9 17l-5-5"></path>
                    </svg>
                    KYC Verified
                  </span>
                </div>
                <div id="seller-reviews-list" class="seller-reviews-list"></div>
              </div>

              <!-- ปุ่มสั่งซื้อและเจรจา -->
              <div class="detail-actions">
                <button class="btn btn-primary btn-lg btn-block" id="direct-order-btn">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"></path>
                  </svg>
                  สั่งจองและเปิดห้องเจรจาโอนเงินทันที
                </button>
                <button class="btn btn-outline btn-block" id="detail-add-cart-btn">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="8" cy="21" r="1"></circle>
                    <circle cx="19" cy="21" r="1"></circle>
                    <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
                  </svg>
                  เพิ่มลงในตะกร้าสินค้า
                </button>
              </div>

            </div>
          </div>
        `;

        loadSellerReviews(product.seller_id);

        // Action Direct Order & Booking
        document.getElementById('direct-order-btn')?.addEventListener('click', async () => {
          if (!Auth.isLoggedIn()) {
            window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
            return;
          }

          const confirmOrder = confirm(`ยืนยันการสั่งจอง "${product.brand || ''} ${product.model || product.part_name || ''}" ในราคา ${formatPrice(product.price)} เพื่อเข้าสู่ขั้นตอนโอนเงินตรงและส่งของใช่หรือไม่?`);
          if (!confirmOrder) return;

          const btn = document.getElementById('direct-order-btn');
          setBtnLoading(btn, true);
          try {
            const bookingRes = await API.post('/bookings', {
              items: [{
                product_id: product.id,
                price: product.price,
                quantity: 1
              }],
              shipping_address: 'รับที่อยู่ตามโปรไฟล์',
              contact_phone: 'ตามโปรไฟล์'
            });

            Toast.success('ทำการสั่งจองสำเร็จ! กำลังนำไปยังห้องเจรจา');
            setTimeout(() => {
              window.location.href = '/inbox.html';
            }, 800);
          } catch (err) {
            Toast.error(err.message || 'ไม่สามารถทำรายการสั่งจองได้');
            setBtnLoading(btn, false);
          }
        });

        // Add to Cart
        document.getElementById('detail-add-cart-btn')?.addEventListener('click', () => {
          Cart.addItem({
            product_id: product.id,
            name: `${product.brand || ''} ${product.model || product.part_name || ''}`,
            price: product.price,
            brand: product.brand,
            model: product.model,
            condition: product.condition,
            seller_name: product.seller_name
          });
          Auth.updateUI();
          Toast.success('เพิ่มสินค้าลงในตะกร้าแล้ว');
        });

        // Wishlist Toggle
        const wishlistBtn = document.getElementById('wishlist-toggle-btn');
        function setWishlistBtnActive(active) {
          if (!wishlistBtn) return;
          wishlistBtn.classList.toggle('active', active);
          wishlistBtn.setAttribute('aria-pressed', active ? 'true' : 'false');
          wishlistBtn.title = active ? 'นำออกจากรายการที่ถูกใจ' : 'เพิ่มในรายการที่ถูกใจ';
        }

        wishlistBtn?.addEventListener('click', async () => {
          if (!Auth.isLoggedIn()) {
            window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
            return;
          }
          if (wishlistBtn.disabled) return;

          const isActive = wishlistBtn.classList.contains('active');
          wishlistBtn.disabled = true;
          try {
            if (isActive) {
              await API.delete(`/auth/wishlist/${product.id}`);
              setWishlistBtnActive(false);
              Toast.success('นำออกจากรายการที่ถูกใจแล้ว');
            } else {
              await API.post('/auth/wishlist', { product_id: product.id });
              setWishlistBtnActive(true);
              Toast.success('เพิ่มในรายการที่ถูกใจแล้ว');
            }
          } catch (err) {
            Toast.error(err.message || 'ไม่สามารถทำรายการที่ถูกใจได้');
          } finally {
            wishlistBtn.disabled = false;
          }
        });

        // Check if this product is already in the user's wishlist to set the initial button state
        if (Auth.isLoggedIn() && wishlistBtn) {
          API.get('/auth/wishlist').then(items => {
            const alreadyWishlisted = Array.isArray(items) && items.some(item => item.id === product.id);
            setWishlistBtnActive(alreadyWishlisted);
          }).catch(err => {
            console.error('Failed to load wishlist state:', err);
          });
        }

      } catch (error) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">${ICON_ALERT_TRIANGLE}</div>
            <h3>ไม่สามารถโหลดรายละเอียดสินค้าได้</h3>
            <p>${escapeHtml(error.message)}</p>
            <a href="/products.html" class="btn btn-primary mt-2">กลับไปหน้ารายการสินค้า</a>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadProductDetail();
      Auth.updateUI();
    });
  </script>
</body>
</html>
